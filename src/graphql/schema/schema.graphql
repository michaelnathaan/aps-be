# GraphQL Schema for APS Backend

# ============================================
# ENUMS
# ============================================

enum UserRole {
  guest
  tenant
  admin
  super_admin
}

enum BookingStatus {
  pending
  confirmed
  expired
  cancelled
}

# ============================================
# TYPES
# ============================================

type User {
  id: Int!
  fullName: String!
  phoneNumber: String!
  role: UserRole!
  isVerifiedTenant: Boolean!
  unitNumber: String
  createdAt: String!
  updatedAt: String!
}

type Facility {
  id: Int!
  name: String!
  description: String
  pricePerHour: Int!
  openTime: String!
  closeTime: String!
  isActive: Boolean!
  createdAt: String!
  updatedAt: String!
}

type Booking {
  id: Int!
  userId: Int!
  facilityId: Int!
  bookingDate: String!
  startTime: String!
  endTime: String!
  status: BookingStatus!
  totalPrice: Int!
  createdAt: String!
  updatedAt: String!
  
  # Nested relationships (resolved via DataLoader)
  user: User!
  facility: Facility!
}

type AvailableSlot {
  startTime: String!
  endTime: String!
  isAvailable: Boolean!
}

type SlotAvailability {
  facilityId: Int!
  date: String!
  slots: [AvailableSlot!]!
}

type UserDashboard {
  user: User!
  bookings: [Booking!]!
  bookingCountToday: Int!
  upcomingBookings: Int!
  totalSpent: Int!
}

type AuthResponse {
  token: String!
  user: User!
}

type LoginResponse {
  token: String
  user: User
  sessionId: String
  expires: Float
}

type OTPSessionResponse {
  phoneNumber: String
  sessionId: String!
  expires: Float!
}

# ============================================
# INPUT TYPES
# ============================================

input LoginInput {
  phoneNumber: String!
}

input OTPInput {
  sessionId: String!
  otp: String!
}

input ResendOTPInput {
  sessionId: String!
}

input CreateBookingInput {
  userId: Int!
  facilityId: Int!
  bookingDate: String!
  startTime: String!
  endTime: String!
}

input SlotAvailabilityInput {
  facilityId: Int!
  date: String!
}

input CreateFacilityInput {
  name: String!
  description: String
  pricePerHour: Int!
  openTime: String!
  closeTime: String!
  isActive: Boolean
}

input UpdateFacilityInput {
  name: String
  description: String
  pricePerHour: Int
  openTime: String
  closeTime: String
  isActive: Boolean
}

input CreateUserInput {
  fullName: String!
  phoneNumber: String!
  role: UserRole
  isVerifiedTenant: Boolean
  unitNumber: String
}

input UpdateUserInput {
  fullName: String
  phoneNumber: String
  role: UserRole
  isVerifiedTenant: Boolean
  unitNumber: String
}

# ============================================
# QUERIES
# ============================================

type Query {
  me: User!

  facilities: [Facility!]!
  facility(id: Int!): Facility!
  availableSlots(input: SlotAvailabilityInput!): SlotAvailability!

  bookings: [Booking!]!           # was missing
  booking(id: Int!): Booking!
  userBookings(userId: Int!, limit: Int!, offset: Int!): [Booking!]!
  userBookingsGeneric(userId: Int!, limit: Int!, offset: Int!): [Booking!]!
  userDashboard(userId: Int!, limit: Int!, offset: Int!): UserDashboard!

  users: [User!]!                 # was missing
  user(id: Int!): User!
}

# ============================================
# MUTATIONS
# ============================================

type Mutation {
  login(input: LoginInput!): LoginResponse!
  verifyOtp(input: OTPInput!): AuthResponse!
  resendOtp(input: ResendOTPInput!): OTPSessionResponse!

  createFacility(input: CreateFacilityInput!): Facility!
  updateFacility(id: Int!, input: UpdateFacilityInput!): Facility!
  deleteFacility(id: Int!): Boolean!

  createUser(input: CreateUserInput!): User!
  updateUser(id: Int!, input: UpdateUserInput!): User!
  deleteUser(id: Int!): Boolean!

  createBooking(input: CreateBookingInput!): Booking!
  confirmBooking(id: Int!): Booking!
  cancelBooking(id: Int!): Booking!
  deleteBooking(id: Int!): Boolean!
}
